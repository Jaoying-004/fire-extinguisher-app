[theme]
# สีปุ่มและไฮไลท์หลัก
primaryColor = "#0066CC"          

# สีพื้นหลังหน้าเว็บฝั่งขวา (เปลี่ยนจากครีมเป็นเทาอ่อนสว่าง)
backgroundColor = "#F4F6F9"       

# สีของ Sidebar และกล่องข้อมูลผู้ใช้ (เปลี่ยนเป็นสีขาวบริสุทธิ์)
secondaryBackgroundColor = "#FFFFFF" 

# สีตัวอักษร (สีดำเข้มอ่านง่าย)
textColor = "#1F2937"
